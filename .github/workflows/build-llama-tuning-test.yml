name: Build llama.cpp tuning test image (A380 matrix-core investigation)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp git ref"
        required: false
        default: master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref }}
          path: llama.cpp

      - name: Apply test patch
        run: python3 llama-server-vulkan/test/test-tuning-patch.py llama.cpp/ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build patched llama.cpp server
        uses: docker/build-push-action@v7
        with:
          context: llama.cpp
          file: llama.cpp/.devops/vulkan.Dockerfile
          target: server
          push: true
          provenance: false
          tags: ghcr.io/bmrowe/llama-server-vulkan-unraid:test-tuning-base

      - name: Add kisak Mesa
        uses: docker/build-push-action@v7
        with:
          context: llama-server-vulkan
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/bmrowe/llama-server-vulkan-unraid:test-tuning-base
          tags: ghcr.io/bmrowe/llama-server-vulkan-unraid:test-tuning
