name: Build test-backend-ops image (A380 matrix-core patch validation)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp git ref (full SHA, tag or branch)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref }}
          path: llama.cpp

      - name: Apply Alchemist matrix-core patch
        run: git -C llama.cpp apply --verbose ../llama-server-vulkan/intel-alchemist-coopmat.patch

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: llama.cpp
          file: llama-server-vulkan/test/Dockerfile.backend-ops
          push: true
          provenance: false
          tags: ghcr.io/bmrowe/llama-server-vulkan-unraid:test-backend-ops
