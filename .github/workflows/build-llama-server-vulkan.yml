name: Build and push llama-server-vulkan-unraid

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing upstream changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - llama-server-vulkan/Dockerfile
      - llama-server-vulkan/intel-alchemist-coopmat.patch
      - llama-server-vulkan/slim-dockerfile.py
      - llama-server-vulkan/test/Dockerfile.backend-ops
      - .github/workflows/build-llama-server-vulkan.yml

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: ghcr.io/ggml-org/llama.cpp:server-vulkan
  IMAGE: ghcr.io/bmrowe/llama-server-vulkan-unraid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Check upstream build, kisak Mesa and patch
        id: check
        run: |
          image_json=$(docker buildx imagetools inspect "$UPSTREAM" --format '{{json .Image}}')
          rev=$(echo "$image_json" | jq -r 'if .config then .config.Labels["org.opencontainers.image.revision"] else .["linux/amd64"].config.Labels["org.opencontainers.image.revision"] end')
          mesa=$(curl -fsSL https://ppa.launchpadcontent.net/kisak/kisak-mesa/ubuntu/dists/resolute/main/binary-amd64/Packages.xz \
            | xz -dc | awk '/^Package: mesa-vulkan-drivers$/{p=1} p&&/^Version:/{print $2; exit}')
          patch_sha=$(sha256sum llama-server-vulkan/intel-alchemist-coopmat.patch | cut -c1-12)
          want="$rev $mesa $patch_sha"
          have=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.config.Labels["io.github.bmrowe.llama-revision"], .config.Labels["io.github.bmrowe.mesa-version"], .config.Labels["io.github.bmrowe.patch-sha"]] | join(" ")' || true)
          echo "want: $want"; echo "have: ${have:-none}"
          { echo "rev=$rev"; echo "mesa=$mesa"; echo "patch_sha=$patch_sha"; } >> "$GITHUB_OUTPUT"
          # main publishes :base/:latest; any other branch publishes test tags only
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            { echo "base_tag=base"; echo "tag=latest"; } >> "$GITHUB_OUTPUT"
          else
            t="test-${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
            { echo "base_tag=$t-base"; echo "tag=$t"; } >> "$GITHUB_OUTPUT"
          fi
          if [ "$want" = "$have" ] && [ "${{ inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ steps.check.outputs.rev }}
          path: llama.cpp

      - name: Apply Alchemist matrix-core patch, trim the build
        if: steps.check.outputs.build == 'true'
        run: |
          git -C llama.cpp apply --verbose ../llama-server-vulkan/intel-alchemist-coopmat.patch
          python3 llama-server-vulkan/slim-dockerfile.py llama.cpp/.devops/vulkan.Dockerfile

      # ccache for both compiles lives in BuildKit cache mounts (ids ccache-server,
      # ccache-tbo); buildkit-cache-dance moves them in and out of the Actions cache.
      - name: Restore ccache
        if: steps.check.outputs.build == 'true'
        id: ccache
        uses: actions/cache@v4
        with:
          path: |
            ccache-server
            ccache-tbo
          key: ccache-vulkan-${{ steps.check.outputs.rev }}-${{ steps.check.outputs.patch_sha }}
          restore-keys: ccache-vulkan-

      - name: Load ccache into BuildKit
        if: steps.check.outputs.build == 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723  # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache-server": {"target": "/root/.cache/ccache", "id": "ccache-server"},
              "ccache-tbo": {"target": "/root/.cache/ccache", "id": "ccache-tbo"}
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      # Gate: the fused MUL_MAT + bias ADD (the one patched path lavapipe can
      # reach) must pass test-backend-ops on lavapipe, Mesa's CPU Vulkan driver,
      # before anything is published (~1 min). Same settings as upstream's
      # llvmpipe CI. The long suites run nightly in test-llama-server-vulkan.yml;
      # the Xe1-dGPU-only paths (tiles, Q6_K subgroup size, Xe FA) still need
      # a run on the A380.
      - name: Build test-backend-ops
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: llama.cpp
          file: llama-server-vulkan/test/Dockerfile.backend-ops
          load: true
          push: false
          provenance: false
          tags: test-backend-ops:ci
          cache-from: type=gha,scope=tbo
          cache-to: type=gha,scope=tbo,mode=min

      - name: Test the fused bias on lavapipe
        if: steps.check.outputs.build == 'true'
        timeout-minutes: 10
        shell: bash  # -eo pipefail: a test failure fails the step despite the grep
        run: |
          docker run --rm \
            -e GGML_VK_VISIBLE_DEVICES=0 \
            -e GGML_VK_DISABLE_F16=1 \
            -e GGML_VK_DISABLE_COOPMAT=1 \
            test-backend-ops:ci -b Vulkan0 -o MUL_MAT_ADD 2>&1 \
            | grep -E "Device description|FAIL|tests passed|Backend"

      - name: Log into GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patched llama.cpp server
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: llama.cpp
          file: llama.cpp/.devops/vulkan.Dockerfile
          target: server
          push: true
          provenance: false
          build-args: |
            APP_REVISION=${{ steps.check.outputs.rev }}
          tags: ${{ env.IMAGE }}:${{ steps.check.outputs.base_tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=min

      - name: Add kisak Mesa and publish
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: llama-server-vulkan
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:${{ steps.check.outputs.base_tag }}
          labels: |
            io.github.bmrowe.llama-revision=${{ steps.check.outputs.rev }}
            io.github.bmrowe.mesa-version=${{ steps.check.outputs.mesa }}
            io.github.bmrowe.patch-sha=${{ steps.check.outputs.patch_sha }}
          tags: ${{ env.IMAGE }}:${{ steps.check.outputs.tag }}
