name: Build and push llama-server-vulkan-unraid

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing upstream changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - llama-server-vulkan/**
      - .github/workflows/build-llama-server-vulkan.yml

permissions:
  contents: read
  packages: write

env:
  BASE: ghcr.io/ggml-org/llama.cpp:server-vulkan
  IMAGE: ghcr.io/bmrowe/llama-server-vulkan-unraid

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check upstream image and kisak Mesa
        id: check
        run: |
          base_digest=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest}}' | jq -r .digest)
          mesa=$(curl -fsSL https://ppa.launchpadcontent.net/kisak/kisak-mesa/ubuntu/dists/resolute/main/binary-amd64/Packages.xz \
            | xz -dc | awk '/^Package: mesa-vulkan-drivers$/{p=1} p&&/^Version:/{print $2; exit}')
          current=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.config.Labels["io.github.bmrowe.base-digest"] // "") + " " + (.config.Labels["io.github.bmrowe.mesa-version"] // "")' || true)
          echo "upstream $base_digest, kisak mesa $mesa, published: ${current:-none}"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"
          echo "mesa=$mesa" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$base_digest $mesa" ] && [ "${{ inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log into GHCR
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: llama-server-vulkan
          push: true
          provenance: false  # single manifest, so the label check above can read it
          build-args: |
            BASE_IMAGE=${{ env.BASE }}@${{ steps.check.outputs.base_digest }}
            BASE_DIGEST=${{ steps.check.outputs.base_digest }}
          labels: |
            io.github.bmrowe.mesa-version=${{ steps.check.outputs.mesa }}
          tags: ${{ env.IMAGE }}:latest
