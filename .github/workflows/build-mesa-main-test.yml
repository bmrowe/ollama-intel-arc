name: Build mesa-main test image (A380 matrix-core investigation)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa git branch or tag"
        required: false
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: llama-server-vulkan/test
          file: llama-server-vulkan/test/Dockerfile.mesa-main
          push: true
          provenance: false
          build-args: |
            MESA_REF=${{ inputs.mesa_ref }}
          tags: ghcr.io/bmrowe/llama-server-vulkan-unraid:test-mesa-main
